[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hgattn"]

[project]
name = "strange-loop-quest"
version = "0.1.0"
description = "Experiments to summon the Strange Loop"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chardet<6.0.0",
    "equinox>=0.13.6",
    "fire>=0.7.1",
    "hydra-core>=1.3.2",
    "jax[cuda]>=0.9.1",
    "jaxtyping>=0.3.9",
    "numpy>=2.4.2",
    "requests>=2.32.5",
    "rotary-embedding-torch>=0.8.9",
    "urllib3<2.3.0",
]

[project.optional-dependencies]
cu130 = ["torch>=2.5"]
cu126 = ["torch>=2.5"]

[dependency-groups]
dev = [
    "ninja>=1.13.0",
]

[tool.uv]
no-build-isolation-package = ["att3ntion"]
conflicts = [
    [
        { extra = "cu130" },
        { extra = "cu126" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", extra = "cu130" },
    { index = "pytorch-cu126", extra = "cu126" },
]
att3ntion = { path = "../att3ntion", editable = true } 

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

