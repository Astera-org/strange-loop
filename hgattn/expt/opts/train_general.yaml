_target_: hgattn.opts.RunOpts

defaults:
  - _self_ 
  - arch: gen_size1
  - attn: rope
  - data: coff3
  - optim: adam
  - sched: reduce_on_plateau
  - embed: std
  - logger: streamvis
  - train: small
  - debug: d1

seed: ${random_int:}
code_tweak: none
data_desc: none

hydra:
  run:
    dir: ${oc.env:HOME}/.hydra
  output_subdir: .hydra

