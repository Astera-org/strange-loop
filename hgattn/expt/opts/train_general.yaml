_target_: hgattn.opts.RunOpts

defaults:
  - _self_ 
  - arch: gen_size1
  - attn: rope
  - data: expr1
  - optim: adam
  - sched: slow 
  - embed: std
  - logger: streamvis
  - train: 10m 
  - metric: m10
  - debug: d1
  - attrs: default

seed: ${random_int:}

hydra:
  run:
    dir: ${oc.env:HOME}/.hydra
  output_subdir: .hydra

