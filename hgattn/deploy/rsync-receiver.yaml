apiVersion: batch/v1
kind: Job 
metadata:
  name: rsync-receiver
  namespace: strange-loop
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: strange-loop-snapshots-robot
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "astera.org/namespace"
          operator: "Exists"
          effect: "NoSchedule"
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: hrbigelow-home 
      containers:
        - name: rsync 
          # image: harbor.astera.sh/strange-loop/mini-rsync:latest
          image: harbor.astera.sh/strange-loop/mini-rsync@sha256:22d48e37afa42929456859698c582caec5f537f1d640fe56fba033fb46d755b5
          imagePullPolicy: Always
          command:
            - socat
            - TCP-LISTEN:873,reuseaddr,fork=0
            - EXEC:"rsync --daemon --config=/etc/rsyncd.conf",nofork
          # resources:
           #  limits:
            #   nvidia.com/gpu: "1"
          stdin: true
          stdinOnce: true
          volumeMounts: 
            - name: workspace
              mountPath: /workspace

