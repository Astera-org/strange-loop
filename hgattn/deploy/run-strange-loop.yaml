apiVersion: batch/v1
kind: Job 
metadata:
  generateName: strange-loop-
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 1200
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: strange-loop-snapshots-robot
      volumes:
        - name: shared
          emptyDir: {}
        - name: home-storage
          persistentVolumeClaim:
            claimName: hrbigelow-home
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "astera.org/namespace"
          operator: "Exists"
          effect: "NoSchedule"

      initContainers:
        - name: install-dependencies
          image: harbor.astera.sh/strange-loop/cuda:13.3.1-devel-ubuntu26.04-custom
          workingDir: /workspace/code

          volumeMounts:
            - name: shared
              mountPath: /opt/shared
            - name: home-storage
              mountPath: /workspace

          resources:
            requests:
              cpu: "4"

          env:
            - name: UV_PROJECT_ENVIRONMENT
              value: "/opt/shared/venv"
            - name: UV_COMPILE_BYTECODE
              value: "1"
            - name: VIRTUAL_ENV
              value: "/opt/shared/venv"
            - name: UV_CACHE_DIR
              value: "/workspace/.cache/uv"
            - name: UV_LINK_MODE
              value: "copy"
            - name: UV_PYTHON_INSTALL_DIR
              value: "/opt/shared/uv-python"

          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail

              echo "Syncing project dependencies from pyproject.toml / uv.lock ..."
              cd strange-loop
              uv sync --extra cu133

              echo "Installing att3ntion wheel"
              uv pip install /workspace/wheels/att3ntion-0.2.0-cp313-cp313-linux_x86_64.whl

              echo "Installing streamvis wheel"
              uv pip install /workspace/wheels/streamvis-0.1.0-py3-none-any.whl

              echo "Environment setup complete"

      containers:
        - name: app
          image: harbor.astera.sh/strange-loop/cuda:13.3.1-devel-ubuntu26.04-custom
          workingDir: /workspace
          env:
            # - name: PATH
              # value: "/opt/shared/venv/bin:$(PATH)"
            - name: VIRTUAL_ENV
              value: "/opt/shared/venv"
            - name: UV_LINK_MODE
              value: "copy"
            - name: UV_PYTHON_INSTALL_DIR
              value: "/opt/shared/uv-python"
            - name: STREAMVIS_GRPC_URI
              value: https://obelisk-streamvis-grpc.astera.work:443
          resources:
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: shared
              mountPath: /opt/shared
            - name: home-storage
              mountPath: /workspace

          # launch an arbitrary python module
          command: ["/opt/shared/venv/bin/python", "-m"]
          args: [] # filled by launcher

