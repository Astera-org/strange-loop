# Builds the images the hgattn/deploy Jobs run, on GitHub-hosted runners:
#
#   strange-loop/cuda:13.3.1-devel-ubuntu26.04-custom   images/cuda
#   strange-loop/mini-rsync:latest                      images/mini-rsync
#
# Pull requests build only; nothing leaves the runner. Pushes to master (and
# manual runs on master) push both images to the private `strange-loop`
# project on harbor.astera.sh, each as sha-<commit> and as the tag above.
#
# Harbor is reachable only over the Astera tailnet: the publish job joins it
# as an ephemeral tag:ci-n device (Tailscale federated identity, no stored
# Tailscale secret), which the tailnet policy limits to Harbor.
#
# The `harbor-publish` environment, deployable from master only, holds:
#   secret HARBOR_ROBOT_SECRET   robot$strange-loop+ci's secret
#   var    TS_CI_CLIENT_ID       Tailscale federated identity client ID
#   var    TS_CI_AUDIENCE        Tailscale federated identity audience
# Setup: astera-infra/infra docs/harbor-library.md, "Team projects".

name: Build job images

on:
  pull_request:
    paths:
      - images/**
      - .github/workflows/images.yml
  push:
    branches: [master]
    paths:
      - images/**
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: harbor.astera.sh
  PROJECT: harbor.astera.sh/strange-loop

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: [cuda, mini-rsync]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The CUDA base unpacks to about 12 GB; this leaves about 30 GB free.
      - name: Free disk
        if: matrix.image == 'cuda'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force >/dev/null
          df -h /

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/${{ matrix.image }}
          platforms: linux/amd64
          push: false

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    environment: harbor-publish
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # tag: the one the hgattn/deploy manifests name. For cuda it repeats
          # the base tag in images/cuda/Dockerfile.
          - image: cuda
            tag: 13.3.1-devel-ubuntu26.04-custom
          - image: mini-rsync
            tag: latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Join tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_CI_CLIENT_ID }}
          audience: ${{ vars.TS_CI_AUDIENCE }}
          tags: tag:ci-n

      - name: Wait for Harbor
        run: |
          for _ in $(seq 1 12); do
            curl -fsS --max-time 5 "https://${REGISTRY}/api/v2.0/ping" && exit 0
            sleep 5
          done
          echo "::error::${REGISTRY} unreachable over the tailnet"; exit 1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: robot$strange-loop+ci
          password: ${{ secrets.HARBOR_ROBOT_SECRET }}

      # The CUDA base unpacks to about 12 GB; this leaves about 30 GB free.
      - name: Free disk
        if: matrix.image == 'cuda'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force >/dev/null
          df -h /

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # sha-<commit> names this build and falls under the project's retention;
      # the manifests' tag moves to the newest build.
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/${{ matrix.image }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.PROJECT }}/${{ matrix.image }}:sha-${{ github.sha }}
            ${{ env.PROJECT }}/${{ matrix.image }}:${{ matrix.tag }}

      - name: Summary
        env:
          IMAGE: ${{ env.PROJECT }}/${{ matrix.image }}
          TAG: ${{ matrix.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "Pushed \`${IMAGE}:${TAG}\` and \`${IMAGE}:sha-${GITHUB_SHA}\`"
            echo
            echo "Digest: \`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
